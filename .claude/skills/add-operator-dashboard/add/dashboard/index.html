<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>NanoClaw Operator</title>
<style>
/* ================= tokens ================= */
:root {
  color-scheme: dark;
  --bg: oklch(0.155 0 0);
  --surface: oklch(0.205 0 0);
  --surface2: oklch(0.25 0 0);
  --line: oklch(0.30 0 0);
  --line-strong: oklch(0.38 0 0);
  --ink: oklch(0.93 0.004 180);
  --muted: oklch(0.72 0.012 190);
  --faint: oklch(0.62 0.01 190);
  --brand: oklch(0.80 0.11 180);          /* interactive teal (text/links/selection) */
  --brand-fill: oklch(0.50 0.10 180);     /* filled controls, white ink on top */
  --brand-fill-ink: #fff;
  --coral: oklch(0.78 0.13 35);           /* playful accent */
  --ok: oklch(0.80 0.16 150);
  --warn: oklch(0.84 0.14 85);
  --err: oklch(0.76 0.14 25);
  --err-fill: oklch(0.50 0.16 27);
  --edge-mention: oklch(0.80 0.11 180);
  --edge-sticky: oklch(0.75 0.12 300);
  --edge-pattern: oklch(0.80 0.16 150);
  --edge-dest: oklch(0.84 0.14 85);
  --edge-a2a: oklch(0.76 0.14 25);
  --tint: 15%;
  --shadow-1: 0 4px 18px rgb(0 0 0 / .35);
  --shadow-2: 0 18px 60px rgb(0 0 0 / .5);
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 20px;
  --z-nav: 30; --z-fab: 35; --z-overlay: 40; --z-drawer: 50; --z-modal: 60; --z-toast: 70; --z-login: 80;
  --font: ui-rounded, "SF Pro Rounded", system-ui, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
}
[data-theme="light"] {
  color-scheme: light;
  --bg: #ffffff;
  --surface: oklch(0.965 0.004 190);
  --surface2: oklch(0.935 0.006 190);
  --line: oklch(0.90 0.006 190);
  --line-strong: oklch(0.82 0.008 190);
  --ink: oklch(0.25 0.02 220);
  --muted: oklch(0.47 0.02 210);
  --faint: oklch(0.55 0.02 210);
  --brand: oklch(0.46 0.09 180);
  --brand-fill: oklch(0.50 0.10 180);
  --coral: oklch(0.50 0.15 32);
  --ok: oklch(0.47 0.13 150);
  --warn: oklch(0.49 0.11 75);
  --err: oklch(0.50 0.17 27);
  --edge-mention: oklch(0.46 0.09 180);
  --edge-sticky: oklch(0.45 0.12 300);
  --edge-pattern: oklch(0.47 0.13 150);
  --edge-dest: oklch(0.55 0.12 75);
  --edge-a2a: oklch(0.50 0.17 27);
  --tint: 12%;
  --shadow-1: 0 4px 18px rgb(23 36 40 / .10);
  --shadow-2: 0 18px 60px rgb(23 36 40 / .18);
}

/* ================= base ================= */
* { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body { min-height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: var(--brand); }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
.ic { width: 18px; height: 18px; flex: none; vertical-align: -3px; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

input, select, textarea {
  font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line-strong);
  border-radius: 10px; padding: 9px 12px; width: 100%; outline: none; min-height: 40px;
}
input:focus, select:focus, textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
::placeholder { color: var(--muted); opacity: 1; }
@media (pointer: coarse) {
  input, select, textarea { min-height: 46px; font-size: 16px; } /* 16px stops iOS zoom */
}

/* ================= buttons ================= */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 36px; padding: 7px 14px; border-radius: 10px;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  font-size: 13px; font-weight: 500; transition: border-color .15s, background .15s, transform .1s;
}
.btn:hover { border-color: var(--brand); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .55; cursor: default; transform: none; }
.btn.pri { background: var(--brand-fill); border-color: var(--brand-fill); color: var(--brand-fill-ink); font-weight: 600; }
.btn.pri:hover { filter: brightness(1.12); border-color: var(--brand-fill); }
.btn.danger { color: var(--err); border-color: color-mix(in srgb, var(--err) 45%, var(--line)); background: transparent; }
.btn.danger:hover { border-color: var(--err); background: color-mix(in srgb, var(--err) 8%, transparent); }
.btn.danger-fill { background: var(--err-fill); border-color: var(--err-fill); color: #fff; font-weight: 600; }
.btn.danger-fill:hover { filter: brightness(1.1); }
.btn.sm { min-height: 30px; padding: 4px 10px; font-size: 12px; border-radius: 8px; }
.btn.icon { padding: 7px; min-width: 36px; }
.btn[hidden] { display: none; }
@media (pointer: coarse) {
  .btn { min-height: 44px; }
  .btn.sm { min-height: 40px; padding: 6px 12px; }
  .btn.icon { min-width: 44px; }
}

/* ================= login ================= */
#login { position: fixed; inset: 0; z-index: var(--z-login); display: flex; align-items: center; justify-content: center; background: var(--bg); padding: 20px; }
#login .card { width: min(420px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 32px 28px; box-shadow: var(--shadow-2); }
#login h1 { font-size: 20px; margin-bottom: 4px; }
#login .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; text-wrap: pretty; }
#login label { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin: 12px 0 6px; }
#login .err { color: var(--err); font-size: 12.5px; margin-top: 10px; min-height: 18px; }
#login .tokrow { display: flex; gap: 8px; }
#login .tokrow input { flex: 1; font-family: var(--mono); font-size: 13px; }
.logo { display: flex; align-items: center; gap: 11px; }
.logo .mark { width: 40px; height: 40px; border-radius: 13px; flex: none; background: var(--brand-fill); color: #fff; display: flex; align-items: center; justify-content: center; }
.logo .mark .ic { width: 24px; height: 24px; }
#login .logo { margin-bottom: 18px; }

/* ================= app shell ================= */
#app { display: none; }
#app.on { display: block; }
#side {
  position: fixed; inset: 0 auto 0 0; width: 240px; z-index: var(--z-nav);
  background: var(--surface); border-right: 1px solid var(--line);
  padding: 16px 12px calc(12px + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; overflow-y: auto;
}
#side .logo { padding: 2px 8px 14px; }
#side .logo b { font-size: 15px; display: block; line-height: 1.2; }
#side .logo span { font-size: 11.5px; color: var(--muted); }
.nav-sec { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 16px 10px 6px; }
.nav-it {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  padding: 8px 10px; border-radius: 10px; color: var(--muted); font-size: 13.5px; font-weight: 500;
  transition: background .15s, color .15s;
}
.nav-it:hover { background: var(--surface2); color: var(--ink); }
.nav-it[aria-current="page"] { background: color-mix(in srgb, var(--brand) 14%, transparent); color: var(--brand); font-weight: 600; }
.nav-it .ic { opacity: .9; }
.badge { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--err-fill); color: #fff; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
#side .foot { margin-top: auto; padding: 12px 8px 0; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 8px; }
#side .foot .row { display: flex; align-items: center; gap: 6px; }
#side .foot .btn.sm { color: var(--muted); }
#side .foot .btn.sm:hover { color: var(--ink); }

#topbar { display: none; }
#bottomnav { display: none; }
#fab { display: none; }

#main { margin-left: 240px; padding: 24px 32px 80px; max-width: 1360px; }

/* -------- mobile shell -------- */
@media (max-width: 899px) {
  #side { display: none; }
  #topbar {
    display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: var(--z-nav);
    background: var(--surface); border-bottom: 1px solid var(--line);
    padding: calc(8px + env(safe-area-inset-top)) 14px 8px; min-height: 56px;
  }
  #topbar .logo .mark { width: 32px; height: 32px; border-radius: 10px; }
  #topbar .logo .mark .ic { width: 19px; height: 19px; }
  #topbar h1 { font-size: 16px; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #bottomnav {
    display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: var(--z-nav);
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 4px 4px calc(4px + env(safe-area-inset-bottom));
  }
  .bnav-it { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; min-height: 52px; border-radius: 12px; color: var(--muted); font-size: 10.5px; font-weight: 600; position: relative; }
  .bnav-it .ic { width: 22px; height: 22px; }
  .bnav-it[aria-current="page"] { color: var(--brand); }
  .bnav-it .badge { position: absolute; top: 2px; left: calc(50% + 6px); margin: 0; }
  #main { margin-left: 0; padding: 16px 14px calc(96px + env(safe-area-inset-bottom)); }
  #fab {
    display: flex; align-items: center; justify-content: center; position: fixed; z-index: var(--z-fab);
    right: 16px; bottom: calc(78px + env(safe-area-inset-bottom)); width: 56px; height: 56px; border-radius: 18px;
    background: var(--brand-fill); color: #fff; box-shadow: var(--shadow-2);
  }
  #fab .ic { width: 26px; height: 26px; }
  #fab[hidden] { display: none; }
}

/* ================= page head ================= */
.pagehead { margin-bottom: 16px; }
.pagehead .toprow { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.pagehead h2 { font-size: 19px; font-weight: 700; }
.pagehead .count { color: var(--muted); font-size: 12.5px; }
.pagehead .desc { color: var(--muted); font-size: 12.5px; margin-top: 3px; max-width: 72ch; text-wrap: pretty; }
.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.toolbar .search { flex: 0 1 260px; min-width: 150px; position: relative; }
.toolbar .search input { padding-left: 34px; }
.toolbar .search .ic { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.spacer { flex: 1; }
#sortsel { display: none; width: auto; }
@media (max-width: 899px) {
  .toolbar .search { flex: 1 1 100%; }
  #sortsel { display: block; flex: 1; }
  .only-desktop { display: none !important; }
}

.live {
  display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 4px 12px; border-radius: 999px;
  border: 1px solid var(--line-strong); color: var(--muted); font-size: 12px; font-weight: 600;
}
.live .dot { width: 7px; height: 7px; border-radius: 999px; background: var(--faint); }
.live[aria-checked="true"] { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
.live[aria-checked="true"] .dot { background: var(--ok); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
@media (pointer: coarse) { .live { min-height: 44px; } }

/* ================= table / cards ================= */
.tablewrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
.data th { text-align: left; padding: 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
.data th button {
  display: inline-flex; align-items: center; gap: 5px; width: 100%; padding: 11px 14px;
  font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted);
}
.data th button:hover { color: var(--ink); }
.data th .arrow { font-size: 9px; }
.data td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
.data tr:last-child td { border-bottom: none; }
.data tbody tr { cursor: pointer; }
.data tbody tr:hover, .data tbody tr:focus-visible { background: var(--surface2); }
td .mono { color: var(--muted); }
.chip { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 999px; background: color-mix(in srgb, var(--muted) 14%, var(--surface)); font-size: 11.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.chip.ok   { color: var(--ok);   background: color-mix(in srgb, var(--ok) var(--tint), var(--surface)); }
.chip.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) var(--tint), var(--surface)); }
.chip.err  { color: var(--err);  background: color-mix(in srgb, var(--err) var(--tint), var(--surface)); }
.chip.acc  { color: var(--brand); background: color-mix(in srgb, var(--brand) var(--tint), var(--surface)); }
.count { color: var(--muted); font-size: 12px; }

/* cards on small screens */
@media (max-width: 699px) {
  .tablewrap { background: none; border: none; border-radius: 0; overflow: visible; }
  .data, .data tbody { display: block; }
  .data thead { display: none; }
  .data tbody tr {
    display: block; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
    margin-bottom: 10px; padding: 12px 14px; overflow-wrap: anywhere;
  }
  .data td > * { min-width: 0; }
  .data td { display: flex; gap: 10px; padding: 4px 0; border: none; align-items: baseline; }
  .data td::before { content: attr(data-label); flex: 0 0 108px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .data td.c-title { display: block; font-size: 15px; padding-bottom: 6px; }
  .data td.c-title::before { display: none; }
}

/* ================= empty & skeleton ================= */
.empty { padding: 44px 20px; text-align: center; }
.empty .eico { width: 56px; height: 56px; margin: 0 auto 12px; border-radius: 18px; display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--coral) 14%, var(--surface)); color: var(--coral); }
.empty .eico .ic { width: 28px; height: 28px; }
.empty .t { font-weight: 700; font-size: 14.5px; }
.empty .h { color: var(--muted); font-size: 12.5px; margin-top: 4px; max-width: 42ch; margin-inline: auto; text-wrap: pretty; }
.empty .btn { margin-top: 14px; }
.skel { display: block; height: 13px; border-radius: 6px; background: var(--surface2); animation: shimmer 1.4s ease-in-out infinite; }
@keyframes shimmer { 50% { opacity: .45; } }

/* ================= overview ================= */
.hello { margin-bottom: 18px; }
.hello h2 { font-size: 22px; font-weight: 800; letter-spacing: -.01em; text-wrap: balance; }
.hello .sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
.healthrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 18px; }
@media (max-width: 699px) { .healthrow { grid-template-columns: 1fr; } }
.health {
  display: flex; align-items: center; gap: 14px; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px;
  transition: border-color .15s;
}
.health:hover { border-color: var(--brand); }
.health .hico { width: 42px; height: 42px; border-radius: 14px; flex: none; display: flex; align-items: center; justify-content: center; }
.health .hico .ic { width: 22px; height: 22px; }
.health.calm .hico { background: color-mix(in srgb, var(--brand) 14%, var(--surface)); color: var(--brand); }
.health.good .hico { background: color-mix(in srgb, var(--ok) var(--tint), var(--surface)); color: var(--ok); }
.health.attn .hico { background: color-mix(in srgb, var(--warn) var(--tint), var(--surface)); color: var(--warn); }
.health.bad .hico { background: color-mix(in srgb, var(--err) var(--tint), var(--surface)); color: var(--err); }
.health .hn { font-size: 21px; font-weight: 800; line-height: 1.1; }
.health .hl { font-size: 12.5px; color: var(--muted); }
.twocol { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 1100px) { .twocol { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
.panel h3 { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.panel h3 .ic { color: var(--muted); }
.panel h3 a { margin-left: auto; font-size: 12px; font-weight: 600; text-decoration: none; }
.panel .body { padding: 4px 0 6px; }
.panel .pempty { padding: 18px 16px; color: var(--muted); font-size: 12.5px; text-align: center; }
.listrow { display: flex; align-items: center; gap: 10px; padding: 8px 16px; font-size: 13px; min-height: 40px; }
.listrow + .listrow { border-top: 1px solid var(--line); }
.listrow .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.listrow .sub { color: var(--muted); font-size: 12px; }
@media (max-width: 699px) {
  .listrow .grow { white-space: normal; overflow-wrap: anywhere; }
}
.invrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.pill {
  display: inline-flex; align-items: center; gap: 7px; min-height: 34px; padding: 4px 13px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: 12.5px; font-weight: 600;
}
.pill b { color: var(--ink); }
.pill:hover { border-color: var(--brand); color: var(--ink); }
@media (pointer: coarse) { .pill { min-height: 44px; } }

/* ================= drawer / sheet ================= */
#overlay { position: fixed; inset: 0; background: rgb(0 0 0 / .5); z-index: var(--z-overlay); display: none; }
#overlay.on { display: block; }
#drawer {
  position: fixed; z-index: var(--z-drawer); background: var(--surface); display: flex; flex-direction: column;
  top: 0; right: 0; bottom: 0; width: min(620px, 96vw);
  border-left: 1px solid var(--line); box-shadow: var(--shadow-2);
  transform: translateX(105%); transition: transform .22s cubic-bezier(.25,1,.5,1); visibility: hidden;
}
#drawer.on { transform: none; visibility: visible; }
#drawer .grab { display: none; }
.dhead { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.dhead h3 { font-size: 15px; }
.dhead .sub { font-size: 11.5px; color: var(--muted); word-break: break-all; }
.dbody { flex: 1; overflow-y: auto; padding: 18px 20px calc(28px + env(safe-area-inset-bottom)); overscroll-behavior: contain; }
@media (max-width: 699px) {
  #drawer {
    top: auto; left: 0; right: 0; bottom: 0; width: 100%; max-height: 88dvh; height: auto;
    border-left: none; border-top: 1px solid var(--line); border-radius: var(--r-xl) var(--r-xl) 0 0;
    transform: translateY(105%);
  }
  #drawer .grab { display: block; width: 40px; height: 4px; border-radius: 999px; background: var(--line-strong); margin: 10px auto 0; flex: none; }
  .dhead { padding: 10px 16px 12px; }
  .dbody { padding: 14px 16px calc(28px + env(safe-area-inset-bottom)); }
}
.kv { width: 100%; border-collapse: collapse; margin-bottom: 18px; }
.kv td { padding: 8px 8px; border-bottom: 1px solid var(--line); font-size: 12.5px; vertical-align: top; }
.kv td:first-child { color: var(--muted); width: 190px; white-space: nowrap; }
.kv td.copyable { cursor: copy; word-break: break-all; white-space: pre-wrap; }
@media (max-width: 699px) {
  .kv, .kv tbody, .kv tr, .kv td { display: block; width: 100%; overflow-wrap: anywhere; }
  .kv td { border-bottom: none; padding: 1px 0; }
  .kv td:first-child { padding-top: 10px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .kv tr { border-bottom: 1px solid var(--line); padding-bottom: 8px; }
}
.dsec { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 20px 0 8px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 12px; }
.note { font-size: 12.5px; color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warn) 30%, var(--line)); border-radius: 10px; padding: 9px 12px; margin: 8px 0; display: flex; gap: 8px; align-items: flex-start; }
.note .ic { flex: none; margin-top: 1px; }
details.raw { margin-top: 22px; }
details.raw summary { cursor: pointer; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 8px; }
details.raw summary:hover { color: var(--ink); }
#editslot .fbtns { justify-content: flex-start; margin-top: 8px; }

/* ================= modal ================= */
#modalwrap { position: fixed; inset: 0; z-index: var(--z-modal); display: none; align-items: center; justify-content: center; background: rgb(0 0 0 / .55); padding: 16px; }
#modalwrap.on { display: flex; }
#modal { width: min(520px, 100%); max-height: 88dvh; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 22px 24px; overscroll-behavior: contain; }
#modal h3 { font-size: 16px; margin-bottom: 4px; }
.msub { color: var(--muted); font-size: 12px; margin-bottom: 14px; font-family: var(--mono); }
@media (max-width: 699px) {
  #modalwrap { align-items: flex-end; padding: 0; }
  #modal { width: 100%; border-radius: var(--r-xl) var(--r-xl) 0 0; border-bottom: none; padding: 20px 18px calc(20px + env(safe-area-inset-bottom)); }
}
.ffield { margin-bottom: 14px; }
.ffield > label { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
.ffield label b.req { color: var(--err); }
.ffield .help { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.fbtns { display: flex; justify-content: flex-end; gap: 9px; margin-top: 18px; }
@media (max-width: 699px) { .fbtns .btn { flex: 1; } }
.confirm-danger {
  color: var(--err); font-size: 13px; font-weight: 600;
  background: color-mix(in srgb, var(--err) 9%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--err) 35%, var(--line));
  border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; display: flex; gap: 8px; align-items: flex-start;
}
.confirm-danger .ic { flex: none; margin-top: 1px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink); cursor: pointer; user-select: none; min-height: 32px; }
.toggle input { width: 18px; height: 18px; min-height: 0; accent-color: var(--brand-fill); }
.ffield .lrow { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.ffield .lrow label { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.ffield .lrow .clearbtn { margin-left: auto; }
.ffield .ferr { display: none; font-size: 12px; color: var(--err); margin-top: 4px; }
.ffield.invalid .ferr { display: block; }
.ffield.invalid input, .ffield.invalid select, .ffield.invalid textarea { border-color: var(--err); box-shadow: 0 0 0 1px var(--err); }
.cleared-note { font-size: 12.5px; color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, var(--surface)); border: 1px dashed color-mix(in srgb, var(--warn) 40%, var(--line)); border-radius: 10px; padding: 8px 12px; margin-top: 6px; }
.presetrow { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.preset { font-size: 11.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--muted); transition: border-color .15s, color .15s; }
.preset:hover { border-color: var(--brand); color: var(--brand); }
.fecho { font-size: 12px; color: var(--ok); margin-top: 5px; }
.fecho.bad { color: var(--err); }
.fecho.dim { color: var(--muted); }
.preset:disabled { opacity: .5; cursor: default; }
.preset:disabled:hover { border-color: var(--line-strong); color: var(--muted); }
.modal-err { display: flex; gap: 8px; align-items: flex-start; color: var(--err); font-size: 12.5px; background: color-mix(in srgb, var(--err) 9%, var(--surface)); border: 1px solid color-mix(in srgb, var(--err) 35%, var(--line)); border-radius: 10px; padding: 10px 12px; margin-top: 12px; }
.modal-err .ic { flex: none; margin-top: 1px; }
.modal-err .cmd { font-family: var(--mono); font-size: 11px; color: var(--muted); word-break: break-all; margin-top: 3px; font-weight: 400; }

/* ================= more sheet (mobile nav) ================= */
#moresheet {
  position: fixed; z-index: var(--z-drawer); left: 0; right: 0; bottom: 0; background: var(--surface);
  border-top: 1px solid var(--line); border-radius: var(--r-xl) var(--r-xl) 0 0; box-shadow: var(--shadow-2);
  transform: translateY(105%); transition: transform .22s cubic-bezier(.25,1,.5,1); visibility: hidden;
  max-height: 85dvh; overflow-y: auto; padding: 8px 12px calc(16px + env(safe-area-inset-bottom)); overscroll-behavior: contain;
}
#moresheet.on { transform: none; visibility: visible; }
#moresheet .grab { width: 40px; height: 4px; border-radius: 999px; background: var(--line-strong); margin: 6px auto 4px; }
#moresheet .nav-it { min-height: 48px; font-size: 14.5px; }
#moresheet .foot { display: flex; gap: 8px; padding: 12px 10px 0; border-top: 1px solid var(--line); margin-top: 10px; align-items: center; color: var(--muted); font-size: 12px; flex-wrap: wrap; }

/* ================= toasts ================= */
#toasts { position: fixed; z-index: var(--z-toast); display: flex; flex-direction: column; gap: 9px; bottom: 18px; right: 18px; max-width: min(440px, calc(100vw - 32px)); }
@media (max-width: 699px) {
  #toasts { top: calc(64px + env(safe-area-inset-top)); bottom: auto; left: 12px; right: 12px; max-width: none; }
}
.toast {
  display: flex; gap: 10px; align-items: flex-start; background: var(--surface2); border: 1px solid var(--line-strong);
  border-radius: var(--r-md); padding: 11px 14px; font-size: 12.5px; box-shadow: var(--shadow-1);
  animation: toast-in .2s cubic-bezier(.25,1,.5,1); cursor: pointer;
}
.toast .tico { width: 26px; height: 26px; border-radius: 9px; flex: none; display: flex; align-items: center; justify-content: center; }
.toast .tico .ic { width: 15px; height: 15px; }
.toast.ok .tico { background: color-mix(in srgb, var(--ok) var(--tint), var(--surface2)); color: var(--ok); }
.toast.err .tico { background: color-mix(in srgb, var(--err) var(--tint), var(--surface2)); color: var(--err); }
.toast .t { font-weight: 700; }
.toast .cmd { font-family: var(--mono); font-size: 11px; color: var(--muted); word-break: break-all; margin-top: 3px; }
@keyframes toast-in { from { transform: translateY(10px); opacity: 0; } }

/* ================= topology ================= */
#topo { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
#topo .canvas { overflow: auto; -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y; }
#topo svg { display: block; }
.tnode { cursor: pointer; }
.tnode rect { fill: var(--surface2); stroke: var(--line-strong); }
.tnode:hover rect, .tnode:focus rect { stroke: var(--brand); stroke-width: 1.6; }
.tnode text { fill: var(--ink); font-size: 12px; font-family: var(--font); font-weight: 600; }
.tnode .sub { fill: var(--muted); font-size: 10px; font-weight: 400; }
.tedge { fill: none; stroke-width: 1.7; opacity: .8; pointer-events: none; }
.thit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; }
.thit:hover + .tedge, .thit:focus + .tedge { stroke-width: 3; opacity: 1; }
.colhead { fill: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-family: var(--font); font-weight: 700; }
.topo-tools { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.legend { display: flex; gap: 14px 18px; padding: 10px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 20px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }

/* ================= chat ================= */
.chatpick { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.agentcard {
  display: flex; flex-direction: column; align-items: flex-start; gap: 7px; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: 14px 16px; min-height: 44px; transition: border-color .15s, transform .1s;
}
.agentcard:hover { border-color: var(--brand); }
.agentcard:active { transform: translateY(1px); }
.agentcard .aico { width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--brand) 14%, var(--surface)); color: var(--brand); }
.agentcard .an { font-size: 14.5px; font-weight: 700; }
.agentcard .af { font-size: 11.5px; color: var(--muted); font-family: var(--mono); overflow-wrap: anywhere; }
.chatwrap { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; height: calc(100dvh - 120px); min-height: 420px; max-width: 920px; }
.chathead { display: flex; align-items: center; gap: 9px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--surface); }
.chathead .who { min-width: 0; flex: 1; }
.chathead .who b { display: block; font-size: 14px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chathead .who .sub { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chathead select { width: auto; max-width: 200px; min-height: 36px; padding: 5px 8px; font-size: 12px; }
.chatbanner { display: none; padding: 8px 14px; font-size: 12px; border-bottom: 1px solid var(--line); }
.chatbanner.on { display: flex; gap: 8px; align-items: flex-start; }
.chatbanner.on .ic { flex: none; margin-top: 1px; }
.chatbanner.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, var(--surface)); }
.chatbanner.err { color: var(--err); background: color-mix(in srgb, var(--err) 10%, var(--surface)); }
.chatlog { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 16px 14px; display: flex; flex-direction: column; background: var(--bg); }
.msg { display: flex; flex-direction: column; align-items: flex-start; margin: 3px 0; }
.msg .bub { max-width: min(78%, 580px); padding: 8px 13px; border-radius: 16px; border-bottom-left-radius: 6px; font-size: 13.5px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--surface2); }
.msg .mt { font-size: 10.5px; color: var(--faint); margin: 3px 6px 0; }
.msg .ms { font-size: 10.5px; font-weight: 700; color: var(--coral); margin: 0 6px 2px; }
.msg .mis { font-size: 10.5px; color: var(--warn); margin: 2px 6px 0; }
.msg.op { align-items: flex-end; }
.msg.op .bub { background: var(--brand-fill); color: var(--brand-fill-ink); border-radius: 16px; border-bottom-right-radius: 6px; }
.msg.us .bub { background: color-mix(in srgb, var(--coral) 14%, var(--surface2)); }
.msg.pending .bub { opacity: .6; }
.typing .bub { display: inline-flex; gap: 4px; padding: 13px 14px; }
.typing .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--muted); animation: tdot 1.2s ease-in-out infinite; }
.typing .dot:nth-child(2) { animation-delay: .15s; }
.typing .dot:nth-child(3) { animation-delay: .3s; }
@keyframes tdot { 30% { transform: translateY(-4px); opacity: .5; } }
.daysep { align-self: center; font-size: 11px; font-weight: 700; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 2px 12px; margin: 10px 0 6px; }
.composer { display: flex; align-items: flex-end; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); background: var(--surface); }
.composer textarea { flex: 1; resize: none; min-height: 40px; max-height: 140px; border-radius: 14px; }
.composer .btn.pri { min-width: 44px; min-height: 44px; border-radius: 14px; flex: none; padding: 0; }
.chatsetup { margin: auto; max-width: 420px; text-align: center; padding: 24px 16px; }
.chatsetup .h { color: var(--muted); font-size: 12.5px; margin: 6px 0 14px; text-wrap: pretty; }
.chatsetup .eico { width: 56px; height: 56px; margin: 0 auto 12px; border-radius: 18px; display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--coral) 14%, var(--surface)); color: var(--coral); }
.chatsetup .eico .ic { width: 28px; height: 28px; }
@media (max-width: 899px) {
  .chatwrap.full { position: fixed; inset: 0 0 var(--kb, 0px) 0; z-index: 45; border: none; border-radius: 0; height: auto; min-height: 0; max-width: none; }
  .chatwrap.full .chathead { padding-top: calc(8px + env(safe-area-inset-top)); }
  .chatwrap.full .composer { padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
  .composer textarea { font-size: 16px; } /* 16px stops iOS zoom */
}
</style>
</head>

<script>
"use strict";
/* =============================== state =============================== */
const S = {
  token: localStorage.getItem("ncl_dash_token") || "",
  page: "overview",
  cache: {},
  rendered: [],
  filter: "",
  sort: {},
  autoTimer: null,
  auto: JSON.parse(localStorage.getItem("ncl_dash_auto") || "true"),
  topoZoom: 1,
  cfgCtx: null,
  drawerRow: null,
  lastFocus: null,
  chat: null,
  chatTimer: null,
};
const $ = (s, r) => (r || document).querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const ico = (name, cls) => `<svg class="ic ${cls || ""}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-${name}"/></svg>`;

/* =============================== api ================================= */
async function api(path, opts = {}) {
  const r = await fetch(path, {
    ...opts,
    headers: { "Authorization": "Bearer " + S.token, "Content-Type": "application/json", ...(opts.headers || {}) },
  });
  if (r.status === 401) { logout(); throw new Error("unauthorized"); }
  return r.json();
}
async function ncl(resource, verb, args = {}) {
  return api("/api/ncl", { method: "POST", body: JSON.stringify({ resource, verb, args }) });
}
async function loadList(resource, force = false) {
  if (!force && S.cache[resource]) return S.cache[resource];
  const res = await ncl(resource, "list");
  if (!res.ok) { toast(false, `Couldn't load ${resource}`, res.error?.message, res.cmd); return S.cache[resource] || []; }
  S.cache[resource] = Array.isArray(res.data) ? res.data : [];
  if (resource === "approvals") updateBadges();
  return S.cache[resource];
}
function pendingApprovals() { return (S.cache.approvals || []).filter(a => a.status === "pending").length; }
function updateBadges() {
  const n = pendingApprovals();
  document.querySelectorAll("[data-badge=approvals]").forEach(el => {
    el.innerHTML = n ? `<span class="badge" aria-label="${n} pending">${n}</span>` : "";
  });
}

/* ============================ auth / theme =========================== */
async function doLogin() {
  const t = $("#tok").value.trim();
  if (!t) { $("#loginerr").textContent = "Paste the token first — it's in dashboard/.token."; return; }
  S.token = t;
  try {
    const r = await fetch("/api/health", { headers: { Authorization: "Bearer " + t } });
    if (r.status === 401) { $("#loginerr").textContent = "That token didn't match. Check dashboard/.token on the host."; return; }
    const j = await r.json();
    localStorage.setItem("ncl_dash_token", t);
    $("#login").style.display = "none";
    $("#app").classList.add("on");
    $("#conninfo").textContent = `${j.data.host}:${j.data.port}`;
    nav(S.page);
  } catch { $("#loginerr").textContent = "Can't reach the server. Is the tailnet up?"; }
}
function logout() {
  localStorage.removeItem("ncl_dash_token"); S.token = "";
  closeAllLayers(); clearInterval(S.autoTimer); stopChatPoll();
  $("#app").classList.remove("on"); $("#login").style.display = "flex"; $("#loginerr").textContent = "";
}
function toggleTokenVis() {
  const i = $("#tok"); i.type = i.type === "password" ? "text" : "password"; i.focus();
}
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  const icon = t === "light" ? "moon" : "sun";
  const label = t === "light" ? "Switch to dark theme" : "Switch to light theme";
  for (const id of ["#themebtn", "#themebtn2"]) {
    const b = $(id); if (b) { b.innerHTML = ico(icon); b.setAttribute("aria-label", label); }
  }
}
function toggleTheme() {
  const t = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  localStorage.setItem("ncl_dash_theme", t);
  applyTheme(t);
}

/* =============================== toasts ============================== */
function toast(ok, title, msg, cmd) {
  const el = document.createElement("div");
  el.className = "toast " + (ok ? "ok" : "err");
  el.innerHTML = `<div class="tico">${ico(ok ? "check-c" : "alert")}</div><div>
    <div class="t">${esc(title)}</div>` +
    (msg ? `<div>${esc(String(msg).slice(0, 400))}</div>` : "") +
    (cmd ? `<div class="cmd">${esc(cmd)}</div>` : "") + `</div>`;
  el.onclick = () => el.remove();
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), ok ? 6000 : 14000);
}

/* ========================= resource registry ========================= */
/* Flag-name convention (deliberate, matches ncl — do NOT "unify"):
   default CRUD verbs (create/update/get/delete) take the kebab-cased Fields
   names (channel-type, agent-group-id, display-name, …) with `id` for row
   identity, while the custom mutation verbs take their verb-description
   names — roles grant/revoke {user, role, group}, members add/remove
   {user, group}, policies set/remove {from, to, approver}, destinations
   add/remove {agent-group-id, local-name}. Renaming either side breaks the
   corresponding ncl calls. */

const mgOpts = () => (S.cache["messaging-groups"] || []).map(m => ({ v: m.id, l: `${m.name || m.platform_id} [${m.channel_type}] (${m.id})` }));
const userOpts = () => (S.cache.users || []).map(u => ({ v: u.id, l: `${u.display_name || ""} ${u.id}`.trim() }));
const agName = id => { const g = (S.cache.groups || []).find(g => g.id === id); return g ? g.name : id; };
const mgName = id => { const m = (S.cache["messaging-groups"] || []).find(m => m.id === id); return m ? (m.name || m.platform_id) : id; };
// Declared before REG on purpose — REG's field defs reference it at script-eval
// time, so declaring it later in the file is a TDZ ReferenceError that kills
// the whole script.
const channelTypeSuggestions = () =>
  [...new Set((S.cache["messaging-groups"] || []).map(m => m.channel_type)
    .concat(["whatsapp", "telegram", "discord", "slack", "matrix", "signal", "imessage", "cli"]))].sort();

function chip(v, cls, title) { return `<span class="chip ${cls || ""}"${title ? ` title="${esc(title)}"` : ""}>${esc(v)}</span>`; }
function statusChip(v) {
  const cls = { active: "ok", running: "ok", pending: "warn", closed: "err", expired: "err", approved: "ok", rejected: "err" }[v] || "";
  return chip(v, cls);
}
/* friendly container status — raw value stays one hover/tap away */
function containerChip(v) {
  if (v === "running") return chip("awake", "ok", "container: running");
  if (v === "stopped") return chip("napping", "", "container: stopped");
  return statusChip(v || "—");
}

const BOTTOM_NAV = ["overview", "chat", "sessions", "approvals"];

/* ============================ navigation ============================= */
function navItem(k, cls) {
  const badge = k === "approvals" ? `<span data-badge="approvals"></span>` : "";
  return `<button class="${cls}" onclick="nav('${k}')" ${S.page === k ? 'aria-current="page"' : ""}>${ico(REG[k].icon)}<span>${REG[k].label}</span>${badge}</button>`;
}
function renderNav() {
  $("#nav").innerHTML = NAV_SECTIONS.map(sec =>
    (sec.name ? `<div class="nav-sec">${sec.name}</div>` : "") +
    sec.items.map(k => navItem(k, "nav-it")).join("")
  ).join("");
  $("#bottomnav").innerHTML =
    BOTTOM_NAV.map(k => navItem(k, "bnav-it")).join("") +
    `<button class="bnav-it" onclick="openMore()" ${!BOTTOM_NAV.includes(S.page) ? 'aria-current="page"' : ""}>${ico("more")}<span>More</span></button>`;
  updateBadges();
}
function openMore() {
  S.lastFocus = document.activeElement;
  $("#moresheet").innerHTML = `<div class="grab"></div>` +
    NAV_SECTIONS.map(sec =>
      (sec.name ? `<div class="nav-sec">${sec.name}</div>` : "") +
      sec.items.map(k => navItem(k, "nav-it")).join("")
    ).join("") +
    `<div class="foot">
       <button class="btn sm icon" onclick="toggleTheme()" aria-label="Toggle theme">${ico(document.documentElement.dataset.theme === "light" ? "moon" : "sun")}</button>
       <button class="btn sm" onclick="logout()">${ico("lock")} Lock</button>
       <span class="mono">${esc($("#conninfo").textContent)}</span>
     </div>`;
  $("#overlay").classList.add("on");
  $("#moresheet").classList.add("on");
  updateBadges();
}
function closeMore() { $("#moresheet").classList.remove("on"); syncOverlay(); }
function syncOverlay() {
  const anyOpen = $("#drawer").classList.contains("on") || $("#moresheet").classList.contains("on");
  $("#overlay").classList.toggle("on", anyOpen);
}
function closeAllLayers() { closeDrawer(); closeMore(); }

async function nav(page) {
  S.page = page; S.filter = "";
  stopChatPoll();
  closeAllLayers(); closeModal();
  renderNav();
  $("#tb-title").textContent = REG[page].label;
  clearInterval(S.autoTimer); S.autoTimer = null;
  const def = REG[page];
  $("#fab").hidden = !def.create;
  if (def.create) $("#fab").setAttribute("aria-label", def.create.title);
  if (def.custom) {
    $("#main").innerHTML = `<div class="pagehead"><div class="toprow"><h2>${esc(def.label)}</h2></div></div>` + skelBlock();
    try { await Promise.all((def.needs || []).map(r => loadList(r))); } catch (e) { /* toasted */ }
    if (S.page !== page) return;
    def.custom();
    if (def.auto && S.auto) startAuto(page);
    return;
  }
  renderTablePage(page, true);
  try { await Promise.all((def.needs || []).map(r => loadList(r))); } catch (e) { /* toasted */ }
  if (S.page !== page) return;
  renderRows(page);
  if (def.auto && S.auto) startAuto(page);
}
function startAuto(page) {
  clearInterval(S.autoTimer);
  S.autoTimer = setInterval(async () => {
    if (document.hidden || S.page !== page) return;
    const def = REG[page];
    if (def.custom) {
      // renderOverview force-refreshes the live resources itself; skip the
      // re-render while any layer is open or focus sits inside the page.
      const focusBusy = document.activeElement && document.activeElement !== document.body && $("#main").contains(document.activeElement);
      if (!$("#drawer").classList.contains("on") && !$("#modalwrap").classList.contains("on") && !$("#moresheet").classList.contains("on") && !focusBusy) def.custom();
    } else {
      await loadList(def.res, true);
      renderRows(page);
    }
  }, 8000);
}
async function refresh() {
  const def = REG[S.page];
  await Promise.all((def.needs || [def.res]).filter(Boolean).map(r => loadList(r, true)));
  if (def.custom) def.custom(); else renderRows(S.page);
}
function toggleAuto(el, page) {
  S.auto = el.getAttribute("aria-checked") !== "true";
  el.setAttribute("aria-checked", String(S.auto));
  localStorage.setItem("ncl_dash_auto", String(S.auto));
  if (S.auto) startAuto(page); else { clearInterval(S.autoTimer); S.autoTimer = null; }
}

/* ============================ table pages ============================ */
function fmtDate(v) {
  if (!v) return `<span class="count">—</span>`;
  // sqlite passthrough rows (created_at/granted_at/added_at…) are UTC in the
  // space-separated "YYYY-MM-DD HH:MM:SS" form, which browsers parse as LOCAL
  // time — skewing every relative time by the viewer's offset. Canonicalize to
  // ISO-Z first; values already in "…T…Z" form pass through unchanged.
  let s = String(v);
  if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}/.test(s)) s = s.replace(" ", "T") + "Z";
  const d = new Date(s);
  if (isNaN(d)) return esc(v);
  const diff = Date.now() - d.getTime();
  // Future values (task next_run) render as "in Xm/h/d" instead of "ago".
  const abs = Math.abs(diff);
  const unit = abs < 3600e3 ? Math.floor(abs / 60e3) + "m" : abs < 86400e3 ? Math.floor(abs / 3600e3) + "h" : Math.floor(abs / 86400e3) + "d";
  const rel = abs < 60e3 ? (diff >= 0 ? "just now" : "in <1m") : diff >= 0 ? unit + " ago" : "in " + unit;
  return `<span title="${esc(d.toISOString())}">${rel}</span>`;
}
function skelBlock(rows = 6) {
  return `<div class="tablewrap" style="padding:16px" aria-hidden="true">` +
    Array.from({ length: rows }, (_, i) => `<span class="skel" style="width:${88 - (i % 3) * 14}%;margin:12px 0"></span>`).join("") +
    `</div>`;
}
function livePill(page) {
  return `<button class="live" role="switch" aria-checked="${S.auto}" onclick="toggleAuto(this,'${page}')" title="Auto-refresh every 8 seconds"><span class="dot"></span>Live</button>`;
}

function renderTablePage(page, loading) {
  const def = REG[page];
  const sortOpts = def.cols.map(c => `<option value="${c.k}:1">${esc(c.l)} ↑</option><option value="${c.k}:-1">${esc(c.l)} ↓</option>`).join("");
  $("#main").innerHTML = `
    <div class="pagehead">
      <div class="toprow">
        <h2>${esc(def.label)}</h2>
        <span class="count" id="rowcount"></span>
      </div>
      <div class="desc">${def.desc || ""}</div>
      <div class="toolbar">
        <label class="search"><span class="sr">Filter rows</span>${ico("search")}<input placeholder="Filter…" value="${esc(S.filter)}" oninput="S.filter=this.value;renderRows('${page}')"></label>
        <select id="sortsel" aria-label="Sort by" onchange="setSortSel('${page}',this.value)"><option value="">Sort…</option>${sortOpts}</select>
        <div class="spacer only-desktop"></div>
        ${def.auto ? livePill(page) : ""}
        <button class="btn icon" onclick="refresh()" aria-label="Refresh">${ico("refresh")}</button>
        ${def.create ? `<button class="btn pri only-desktop" onclick="openCreate('${page}')">${ico("plus")} ${esc(def.create.btn || def.create.title)}</button>` : ""}
      </div>
    </div>
    <div class="tablewrap"><table class="data">
      <thead><tr>${def.cols.map(c => `<th aria-sort="none" id="th-${c.k}"><button type="button" onclick="sortBy('${page}','${c.k}')">${c.l} <span class="arrow" id="arr-${c.k}"></span></button></th>`).join("")}</tr></thead>
      <tbody id="tbody">${loading ? `<tr><td colspan="${def.cols.length}" style="padding:16px">` + Array.from({ length: 5 }, (_, i) => `<span class="skel" style="width:${90 - (i % 3) * 16}%;margin:12px 0"></span>`).join("") + `</td></tr>` : ""}</tbody>
    </table></div>`;
  if (!loading) renderRows(page);
}

function sortBy(page, col) {
  const s = S.sort[page] || {};
  S.sort[page] = { col, dir: s.col === col && s.dir === 1 ? -1 : 1 };
  renderRows(page);
}
function setSortSel(page, v) {
  if (!v) { delete S.sort[page]; } else {
    const [col, dir] = v.split(":");
    S.sort[page] = { col, dir: +dir };
  }
  renderRows(page);
}

function rowsFor(page) {
  const def = REG[page];
  let rows = (S.cache[def.res] || []).slice();
  if (S.filter) {
    const f = S.filter.toLowerCase();
    rows = rows.filter(r => JSON.stringify(r).toLowerCase().includes(f));
  }
  const s = S.sort[page];
  if (s) rows.sort((a, b) => {
    const x = a[s.col], y = b[s.col];
    return (x == null ? -1 : y == null ? 1 : String(x).localeCompare(String(y), undefined, { numeric: true })) * s.dir;
  });
  return rows;
}

function emptyHtml(def) {
  if (S.filter) {
    return `<div class="empty"><div class="eico">${ico("search")}</div>
      <div class="t">Nothing matches “${esc(S.filter)}”</div>
      <div class="h">Try a shorter fragment — the filter searches every field, IDs included.</div>
      <button class="btn sm" onclick="S.filter='';renderTablePage(S.page)">Clear filter</button></div>`;
  }
  const e = def.empty || { t: "Nothing here yet", h: "" };
  return `<div class="empty"><div class="eico">${ico("sparkle")}</div>
    <div class="t">${esc(e.t)}</div><div class="h">${esc(e.h)}</div>
    ${def.create ? `<button class="btn pri" onclick="openCreate(S.page)">${ico("plus")} ${esc(def.create.btn || def.create.title)}</button>` : ""}</div>`;
}

function renderRows(page) {
  if (S.page !== page) return;
  const def = REG[page];
  // Compute rows ONCE and snapshot them alongside the DOM we're about to write.
  // Row click handlers resolve by positional index into THIS exact array — never
  // rowsFor() again (which re-filters/re-sorts and would pick the wrong row after
  // an auto-refresh or re-sort between render and click).
  const rows = rowsFor(page);
  S.rendered = rows;
  const tb = $("#tbody");
  if (!tb) return;
  const rc = $("#rowcount");
  if (rc) rc.textContent = `${rows.length} row${rows.length === 1 ? "" : "s"}`;
  def.cols.forEach(c => {
    const el = $("#arr-" + CSS.escape(c.k));
    const th = $("#th-" + CSS.escape(c.k));
    const cur = S.sort[page]?.col === c.k;
    if (el) el.textContent = cur ? (S.sort[page].dir === 1 ? "▲" : "▼") : "";
    if (th) th.setAttribute("aria-sort", cur ? (S.sort[page].dir === 1 ? "ascending" : "descending") : "none");
  });
  if (!rows.length) { tb.innerHTML = `<tr><td colspan="${def.cols.length}">${emptyHtml(def)}</td></tr>`; return; }
  // Row actions live in the detail drawer now — the row itself is a single
  // "open it" target, not a strip of tiny buttons.
  tb.innerHTML = rows.map((r, i) =>
    `<tr tabindex="0" onclick="openDetail('${page}',${i})" onkeydown="if(event.key==='Enter'){openDetail('${page}',${i})}">` +
    def.cols.map((c, ci) => `<td data-label="${esc(c.l)}"${ci === 0 ? ' class="c-title"' : ""}>${c.r(r)}</td>`).join("") +
    `</tr>`
  ).join("");
}
/* Drawer actions resolve against the row object captured at open time — NOT a
   positional index into S.rendered, which auto-refresh and post-action
   refresh() rewrite while the drawer stays open (a stale index would aim
   Pause/Delete at whatever row now occupies that position). */
function drawerAction(page, j) {
  const r = S.drawerRow;
  if (!r) return;
  REG[page].rowActions(r)[j].f();
}

/* ============================ detail drawer ========================== */
function openDetail(page, i) {
  const def = REG[page];
  const r = S.rendered[i];
  if (!r) return;
  const name = r.name || r.display_name || r.title || r.local_name || r.sender_name || r.series_id || r.user_id || r.id || r.approval_id || "";
  const sub = `${def.label.replace(/s$/, "")} · ${r.id || r.series_id || r.approval_id || r.local_name || r.user_id || ""}`;
  S.drawerRow = r;
  openDrawer(String(name), sub, `
    ${def.rowActions ? `<div class="actions">${def.rowActions(r).map((a, j) =>

/* The drawer IS the edit surface: prefilled form inline, actions above, raw
   field dump collapsed below. Resources declare an `edit` def in REG —
   fields(r, hydrated?), submit(r, vals), optional hydrate (fetch the full
   record first; list rows may be truncated) and afterHydrate (extra sections
   fed from the same fetch, e.g. the task run log). */
async function renderDrawerEdit(page, r) {
  const def = REG[page];
  let extra = null;
  if (def.edit.hydrate) extra = await def.edit.hydrate(r);
  const slot = $("#editslot");
  // Bail if the drawer closed, the user navigated, or another row was opened
  // while the hydrate was in flight — mounting row A's form (and Save target)
  // inside row B's drawer would edit the wrong record.
  if (!slot || S.page !== page || S.drawerRow !== r) return;
  if (def.edit.afterHydrate) def.edit.afterHydrate(r, extra);
  const fields = def.edit.fields(r, extra);
  const cleared = {};
  slot.innerHTML = fields.map(f => fieldHtml(f, "d-", fields)).join("") +
    `<div class="fbtns"><button class="btn pri" id="dsave">Save changes</button></div>`;
  wireFieldBehaviors(slot, fields, cleared, "d-");
  slot.onkeydown = e => {
    if (e.key === "Enter" && e.target.tagName === "INPUT") { e.preventDefault(); $("#dsave").click(); }
  };

    resetFieldErrors(slot);
    const oldErr = slot.querySelector(".modal-err"); if (oldErr) oldErr.remove();
    const { vals, firstBad } = collectFields(fields, cleared, "d-");
    if (firstBad) { firstBad.focus(); return; }
    const sb = $("#dsave");

    let res;
    try { res = await def.edit.submit(r, vals); } catch (e) { res = { ok: false, error: { message: e.message } }; }
    if (!res.ok) {
      sb.disabled = false; sb.textContent = "Save changes";
      slot.querySelector(".fbtns").before(inlineErrBox(res));
      return;
    }
    toast(true, `${def.label.replace(/s$/, "")} updated`, typeof res.data === "string" ? res.data : "", res.cmd);
    await refresh();
    if (S.page !== page) return;
    // reopen against the refreshed row so prefills and the field dump are current
    const key = r.id ?? r.series_id;
    const idx = S.rendered.findIndex(x => (x.id ?? x.series_id) === key);
    if (idx >= 0) openDetail(page, idx); else closeDrawer();
  };
}

/* ============================ cron helpers =========================== */
const CRON_PRESETS = [
  { l: "daily 9:00", v: "0 9 * * *" },
  { l: "weekdays 8:30", v: "30 8 * * 1-5" },
  { l: "hourly", v: "0 * * * *" },
  { l: "Mondays 9:00", v: "0 9 * * 1" },
  { l: "1st of month 9:00", v: "0 9 1 * *" },
];
function parseCronField(f, min, max) {
  const out = new Set();
  for (const part of f.split(",")) {
    let m;
    if (part === "*") { for (let i = min; i <= max; i++) out.add(i); }
    else if ((m = part.match(/^\*\/(\d+)$/))) { const st = +m[1]; if (!st) return null; for (let i = min; i <= max; i += st) out.add(i); }
    else if ((m = part.match(/^(\d+)-(\d+)(?:\/(\d+))?$/))) { const a = +m[1], b = +m[2], st = +(m[3] || 1); if (a < min || b > max || a > b || !st) return null; for (let i = a; i <= b; i += st) out.add(i); }
    else if ((m = part.match(/^(\d+)$/))) { const v = +m[1]; if (v < min || v > max) return null; out.add(v); }
    else return null;
  }
  return out;
}
function parseCron(expr) {
  const p = String(expr).trim().split(/\s+/);
  if (p.length !== 5) return null;
  const mins = parseCronField(p[0], 0, 59), hrs = parseCronField(p[1], 0, 23),
    dom = parseCronField(p[2], 1, 31), mon = parseCronField(p[3], 1, 12), dow = parseCronField(p[4], 0, 7);
  if (!mins || !hrs || !dom || !mon || !dow) return null;
  if (dow.has(7)) dow.add(0);
  return { mins, hrs, dom, mon, dow, raw: p };
}
function cronNextRuns(c, n) {
  const out = [];
  const d = new Date(); d.setSeconds(0, 0); d.setMinutes(d.getMinutes() + 1);
  const domAll = c.raw[2] === "*", dowAll = c.raw[4] === "*";
  // vixie-cron rule: when both day fields are restricted, either may match
  const dayOk = () => (domAll && dowAll) || (domAll ? c.dow.has(d.getDay()) : dowAll ? c.dom.has(d.getDate()) : (c.dom.has(d.getDate()) || c.dow.has(d.getDay())));
  for (let guard = 0; guard < 200000 && out.length < n; guard++) {
    if (!c.mon.has(d.getMonth() + 1)) { d.setMonth(d.getMonth() + 1, 1); d.setHours(0, 0, 0, 0); continue; }
    if (!dayOk()) { d.setDate(d.getDate() + 1); d.setHours(0, 0, 0, 0); continue; }
    if (!c.hrs.has(d.getHours())) { d.setHours(d.getHours() + 1, 0, 0, 0); continue; }
    if (!c.mins.has(d.getMinutes())) { d.setMinutes(d.getMinutes() + 1); continue; }
    out.push(new Date(d)); d.setMinutes(d.getMinutes() + 1);
  }
  return out;
}
function updateCronEcho(inp) {
  const el = document.getElementById(inp.id + "-echo");
  if (!el) return;
  const v = inp.value.trim();
  if (!v || v === "null") { el.className = "fecho"; el.textContent = ""; return; }
  const c = parseCron(v);
  // The preview parser only speaks numeric 5-field cron; the server (cron-parser)
  // also accepts MON-FRI, @daily, 6-field seconds, etc. Never claim "invalid"
  // for what we merely can't preview — and never block the submit on it.
  if (!c) { el.className = "fecho dim"; el.textContent = "No preview for this expression — the server validates it on save."; return; }
  const runs = cronNextRuns(c, 3);
  const perDay = c.hrs.size * c.mins.size;
  const when = runs.map(d => d.toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })).join(" · ");
  el.className = perDay > 4 ? "fecho bad" : "fecho";
  el.textContent = (runs.length ? "Next: " + when : "No fire in the next year") +
    (perDay > 4 ? ` — ≈${perDay} fires/day: needs a gate script or the override below` : "");
}

let modalSubmit = null;
let modalCleared = null;
function selOptionsHtml(list, placeholder, selected) {
  return (placeholder ? [{ v: "", l: placeholder }] : []).concat(list || []).map(o =>
    `<option value="${esc(o.v)}" ${String(selected ?? "") === String(o.v) ? "selected" : ""}>${esc(o.l)}</option>`).join("");
}
/* Field def options beyond the basics:
   - value: prefill (edit forms should ALWAYS prefill — no blank-means-unchanged)
   - clearable: {sentinel, note} — renders a Clear/Undo toggle that submits the
     sentinel (e.g. "null") instead of asking users to type it
   - dependsOn + optionsFor(depVal): select whose options follow another field
   - suggest: array|fn — datalist suggestions on a free-text input
   - validate(v): string error | null, checked client-side before submit
   - type "cron": input + preset chips + live next-fires echo

   The engine below is shared by the create/confirm modal (pfx "f-") and the
   drawer's inline edit form (pfx "d-") — the prefix keeps element ids unique
   when both are on screen at once. */
function fieldHtml(f, pfx, fields) {
  const id = pfx + f.key;
  let input;
  if (f.type === "select") {
    let optHtml;
    if (f.dependsOn) {
      const dep = fields.find(x => x.key === f.dependsOn);
      const depVal = String(dep?.value ?? "");
      optHtml = selOptionsHtml(depVal && f.optionsFor ? f.optionsFor(depVal) : [],
        depVal ? "— select —" : `— choose ${dep ? dep.label.toLowerCase() : f.dependsOn} first —`, f.value);
    } else {
      const opts2 = f.optionsFn ? f.optionsFn() : f.options;
      optHtml = selOptionsHtml(opts2, f.req && !f.value ? "— select —" : null, f.value);
    }
    input = `<select id="${id}">${optHtml}</select>`;
  } else if (f.type === "checkbox") {
    input = `<label class="toggle"><input type="checkbox" id="${id}"${f.value ? " checked" : ""}> yes</label>`;
  } else if (f.type === "textarea") {
    input = `<textarea id="${id}" rows="${f.rows || 3}">${esc(f.value ?? "")}</textarea>`;
  } else if (f.type === "cron") {
    input = `<input id="${id}" value="${esc(f.value ?? "")}" autocomplete="off" spellcheck="false">
      <div class="presetrow">${CRON_PRESETS.map(p => `<button type="button" class="preset" data-cron="${esc(p.v)}" data-for="${id}">${esc(p.l)}</button>`).join("")}</div>
      <div class="fecho" id="${id}-echo" aria-live="polite"></div>`;
  } else {
    const dl = f.suggest ? (typeof f.suggest === "function" ? f.suggest() : f.suggest) : null;
    input = `<input id="${id}" value="${esc(f.value ?? "")}" ${dl ? `list="${id}-dl"` : ""} ${f.expect ? 'autocomplete="off" spellcheck="false"' : ""}>` +
      (dl ? `<datalist id="${id}-dl">${dl.map(v => `<option value="${esc(v)}">`).join("")}</datalist>` : "");
  }
  const clearBtn = f.clearable ? `<button type="button" class="btn sm clearbtn" data-clear="${esc(f.key)}">Clear</button>` : "";
  return `<div class="ffield" id="ff-${id}">
    <div class="lrow"><label for="${id}">${esc(f.label)} ${f.req ? '<b class="req" aria-hidden="true">*</b>' : ""}</label>${clearBtn}</div>
    ${input}
    ${f.help ? `<div class="help">${esc(f.help)}</div>` : ""}
    <div class="ferr" id="${id}-err"></div>
  </div>`;
}
function wireFieldBehaviors(root, fields, cleared, pfx) {
  // clear/undo toggles
  root.querySelectorAll("[data-clear]").forEach(b => {
    const key = b.dataset.clear;
    const f = fields.find(x => x.key === key);
    b.setAttribute("aria-label", `Clear ${f.label}`);
    b.onclick = () => {
      const ff = document.getElementById("ff-" + pfx + key);
      const isCleared = cleared[key] = !cleared[key];
      const inp = ff.querySelector("input, textarea, select");
      if (inp) inp.disabled = isCleared;
      b.textContent = isCleared ? "Undo" : "Clear";
      b.setAttribute("aria-label", isCleared ? `Undo clearing ${f.label}` : `Clear ${f.label}`);
      // a cleared cron field must not keep advertising its old "Next: …" future
      // or clickable-looking presets
      ff.querySelectorAll(".preset").forEach(p => p.disabled = isCleared);
      if (f.type === "cron" && inp) {
        const echoEl = document.getElementById(inp.id + "-echo");
        if (echoEl) { if (isCleared) { echoEl.className = "fecho"; echoEl.textContent = ""; } else updateCronEcho(inp); }
      }
      let noteEl = ff.querySelector(".cleared-note");
      if (isCleared) {
        if (!noteEl) { noteEl = document.createElement("div"); noteEl.className = "cleared-note"; noteEl.setAttribute("role", "status"); ff.appendChild(noteEl); }
        noteEl.textContent = (f.clearable && f.clearable.note) || "Will be cleared.";
      } else if (noteEl) noteEl.remove();
    };
  });
  // cron presets + live echo
  root.querySelectorAll(".preset").forEach(b => b.onclick = () => {
    const inp = document.getElementById(b.dataset.for);
    if (!inp || inp.disabled) return;
    inp.value = b.dataset.cron;
    inp.dispatchEvent(new Event("input"));
  });
  fields.filter(f => f.type === "cron").forEach(f => {
    const inp = document.getElementById(pfx + f.key);
    if (!inp) return;
    inp.addEventListener("input", () => updateCronEcho(inp));
    updateCronEcho(inp);
  });
  // dependent selects (e.g. destination target follows target type)
  fields.filter(f => f.dependsOn && f.optionsFor).forEach(f => {
    const dep = document.getElementById(pfx + f.dependsOn);
    const target = document.getElementById(pfx + f.key);
    if (!dep || !target) return;
    dep.addEventListener("change", () => {
      target.innerHTML = selOptionsHtml(dep.value ? f.optionsFor(dep.value) : [],
        dep.value ? "— select —" : "— choose above first —", "");
    });
  });
}
function collectFields(fields, cleared, pfx) {
  const vals = {};
  let firstBad = null;
  const bad = (f, msg) => {
    const ff = document.getElementById("ff-" + pfx + f.key);
    if (ff) {
      ff.classList.add("invalid");
      const e = document.getElementById(pfx + f.key + "-err");
      if (e) e.textContent = msg;
    }
    const inp = document.getElementById(pfx + f.key);
    // announce to AT: focus lands on the field, describedby carries the message
    if (inp) { inp.setAttribute("aria-invalid", "true"); inp.setAttribute("aria-describedby", pfx + f.key + "-err"); }
    if (!firstBad) firstBad = inp;
  };
  for (const f of fields) {
    if (cleared[f.key]) { vals[f.key] = f.clearable.sentinel; continue; }
    const el = document.getElementById(pfx + f.key);
    let v = f.type === "checkbox" ? el.checked : el.value.trim();
    if (f.req && (v === "" || v === false || v === undefined)) { bad(f, "Required."); continue; }
    if (f.expect !== undefined) {
      // Normalize both sides: the input arrives trimmed, so trim the expected
      // value too — otherwise a name with leading/trailing whitespace can never
      // be typed to match and the group becomes permanently undeletable.
      const expect = String(f.expect).trim();
      if (String(v).trim() !== expect) { bad(f, `Type "${expect}" exactly to confirm.`); continue; }
      continue; // confirmation-only field, not an ncl arg
    }
    if (v !== "" && v !== false && f.validate) {
      const msg = f.validate(String(v));
      if (msg) { bad(f, msg); continue; }
    }
    if (v !== "" && v !== false) vals[f.key] = v;
  }
  return { vals, firstBad };
}
function resetFieldErrors(root) {
  root.querySelectorAll(".ffield.invalid").forEach(el => el.classList.remove("invalid"));
  root.querySelectorAll("[aria-invalid]").forEach(el => { el.removeAttribute("aria-invalid"); el.removeAttribute("aria-describedby"); });
}
function inlineErrBox(res) {
  // pinned inside the form — corner toasts vanish and detach the failure from
  // the form that caused it
  const box = document.createElement("div");
  box.className = "modal-err"; box.setAttribute("role", "alert");
  box.innerHTML = `${ico("alert")}<div><b>${esc(res.error?.message || "The command failed.")}</b>${res.cmd ? `<div class="cmd">${esc(res.cmd)}</div>` : ""}</div>`;
  return box;
}
function formModal(title, cmdLabel, fields, submitFn, onDone, opts = {}) {
  const { note, danger, submitLabel } = opts;
  S.lastFocus = document.activeElement;
  modalCleared = {};
  const wrap = $("#modalwrap"); const m = $("#modal");
  m.innerHTML = `
    <h3 id="modal-title">${esc(title)}</h3>
    <div class="msub">ncl ${esc(cmdLabel)}</div>
    ${danger ? `<div class="confirm-danger">${ico("alert")}<span>This changes the live instance. Double-check before you go.</span></div>` : ""}
    ${note ? `<div class="note">${ico("alert")}<span>${esc(note)}</span></div>` : ""}
    ${fields.map(f => fieldHtml(f, "f-", fields)).join("")}
    <div class="fbtns">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn ${danger ? "danger-fill" : "pri"}" id="msubmit">${esc(submitLabel || "Submit")}</button>
    </div>`;
  m.setAttribute("aria-labelledby", "modal-title");
  wrap.classList.add("on");
  // Enter submits — the modal has no <form>, so implicit submission never fires
  // and Enter in a text input (e.g. the type-to-confirm delete field) was dead.
  m.onkeydown = e => {
    if (e.key === "Enter" && e.target.tagName === "INPUT") { e.preventDefault(); if (modalSubmit) modalSubmit(); }
  };
  wireFieldBehaviors(m, fields, modalCleared, "f-");
  const first = m.querySelector("input, select, textarea, #msubmit");
  if (first) first.focus();
  modalSubmit = async () => {
    resetFieldErrors(m);
    const oldErr = m.querySelector(".modal-err"); if (oldErr) oldErr.remove();
    const { vals, firstBad } = collectFields(fields, modalCleared, "f-");
    if (firstBad) { firstBad.focus(); return; }
    const sb = $("#msubmit");
    sb.disabled = true; sb.textContent = "Running…";
    let res;
    try { res = await submitFn(vals); } catch (e) { res = { ok: false, error: { message: e.message } }; }
    if (res.ok) {
      toast(true, title.replace(/[?]$/, "") + " — done", typeof res.data === "string" ? res.data : summarize(res.data), res.cmd);
      closeModal(); onDone && onDone(res);
    } else {
      sb.disabled = false; sb.textContent = submitLabel || "Submit";
      m.querySelector(".fbtns").before(inlineErrBox(res));
    }
  };
  $("#msubmit").onclick = modalSubmit;
}
function summarize(d) {
  if (d == null) return "";
  if (typeof d === "object") { const s = JSON.stringify(d); return s.length > 260 ? s.slice(0, 260) + "…" : s; }
  return String(d);
}
/* Danger is opt-in per call site now. When every confirm shows the same red
   "double-check" banner, red stops meaning anything — pause/resume/run-now are
   routine and get a plain consequence note; destructive ops pass {danger: 1}. */
function confirmModal(title, detail, actionFn, onDone, verb, opts = {}) {
  formModal(title, "confirm", [], actionFn, onDone, { note: detail, danger: opts.danger, submitLabel: verb || "Confirm" });
}
function closeModal() {
  const wrap = $("#modalwrap");
  if (!wrap.classList.contains("on")) return;
  wrap.classList.remove("on");
  if (S.lastFocus && S.lastFocus.isConnected) S.lastFocus.focus();
}
$("#modalwrap").addEventListener("click", e => { if (e.target.id === "modalwrap") closeModal(); });
document.addEventListener("keydown", e => {

function topoZoom(delta) {
  S.topoZoom = delta === 0 ? 1 : Math.min(2.5, Math.max(0.4, S.topoZoom + delta));
  const svg = $("#topo svg");
  if (svg) svg.style.width = Math.round(svg.dataset.w * S.topoZoom) + "px";
}
function renderTopology() {
  const mgs = S.cache["messaging-groups"] || [];
  const ags = S.cache.groups || [];
  const wirings = S.cache.wirings || [];
  const dests = S.cache.destinations || [];

  const NW = 240, NH = 46, GAPY = 16, COLGAP = 380, PAD = 30, TOP = 56;
  const mgY = {}, agY = {};
  mgs.forEach((m, i) => mgY[m.id] = TOP + i * (NH + GAPY));
  ags.forEach((g, i) => agY[g.id] = TOP + i * (NH + GAPY));
  const H = Math.max(mgs.length, ags.length) * (NH + GAPY) + TOP + PAD;
  const x1 = PAD, x2 = PAD + NW + COLGAP;
  const W = x2 + NW + PAD + 70;

  const edgeVar = { mention: "var(--edge-mention)", "mention-sticky": "var(--edge-sticky)", pattern: "var(--edge-pattern)" };
  let svg = "";
  svg += `<text class="colhead" x="${x1}" y="26">Messaging groups (${mgs.length})</text>`;
  svg += `<text class="colhead" x="${x2}" y="26">Agent groups (${ags.length})</text>`;

  const edge = (d, stroke, dash, title, onclick) =>
    `<g${onclick ? ` onclick="${onclick}" role="button" tabindex="0" onkeydown="if(event.key==='Enter'){${onclick}}"` : ""}>` +
    `<path class="thit" d="${d}"><title>${title}</title></path>` +
    `<path class="tedge" stroke="${stroke}"${dash ? ` stroke-dasharray="${dash}"` : ""} d="${d}"/></g>`;

  for (const w of wirings) {
    const ya = mgY[w.messaging_group_id], yb = agY[w.agent_group_id];
    if (ya === undefined || yb === undefined) continue;
    const sx = x1 + NW, sy = ya + NH / 2, ex = x2, ey = yb + NH / 2;
    const c = edgeVar[w.engage_mode] || "var(--muted)";
    const d = `M${sx},${sy} C${sx + COLGAP / 2},${sy} ${ex - COLGAP / 2},${ey} ${ex},${ey}`;
    const t = `wiring — ${esc(mgName(w.messaging_group_id))} → ${esc(agName(w.agent_group_id))} · engage=${esc(w.engage_mode)}${w.engage_pattern ? " /" + esc(w.engage_pattern) + "/" : ""} · session=${esc(w.session_mode)}`;
    svg += edge(d, c, "", t, `topoOpen('wirings','${esc(w.id)}')`);
  }
  for (const d of dests) {
    if (d.target_type === "channel") {
      const ya = agY[d.agent_group_id], yb = mgY[d.target_id];
      if (ya === undefined || yb === undefined) continue;
      const sx = x2, sy = ya + NH / 2 + 8, ex = x1 + NW, ey = yb + NH / 2 + 8;
      const p = `M${sx},${sy} C${sx - COLGAP / 2},${sy} ${ex + COLGAP / 2},${ey} ${ex},${ey}`;
      svg += edge(p, "var(--edge-dest)", "5 4", `destination "${esc(d.local_name)}" — ${esc(agName(d.agent_group_id))} sends → ${esc(mgName(d.target_id))}`);
    } else {
      const ya = agY[d.agent_group_id], yb = agY[d.target_id];
      if (ya === undefined || yb === undefined) continue;
      const sx = x2 + NW, sy = ya + NH / 2, ey = yb + NH / 2;
      const bow = 40 + Math.abs(ey - sy) / 6;
      const p = `M${sx},${sy} C${sx + bow},${sy} ${sx + bow},${ey} ${sx},${ey}`;
      svg += edge(p, "var(--edge-a2a)", "2 4", `A2A destination "${esc(d.local_name)}" — ${esc(agName(d.agent_group_id))} → ${esc(agName(d.target_id))}`);
    }
  }
  mgs.forEach(m => {
    const y = mgY[m.id];
    svg += `<g class="tnode" transform="translate(${x1},${y})" role="button" tabindex="0" onclick="topoOpen('messaging-groups','${esc(m.id)}')" onkeydown="if(event.key==='Enter'){topoOpen('messaging-groups','${esc(m.id)}')}">
      <rect width="${NW}" height="${NH}" rx="12"></rect>
      <text x="12" y="19">${esc(trunc(m.name || m.platform_id, 26))}</text>
      <text x="12" y="35" class="sub">${esc(m.channel_type)} · ${m.is_group ? "group" : "DM"} · ${esc(m.unknown_sender_policy)}</text>
      <title>${esc(m.id)} — ${esc(m.platform_id)}</title></g>`;
  });
  ags.forEach(g => {
    const y = agY[g.id];
    svg += `<g class="tnode" transform="translate(${x2},${y})" role="button" tabindex="0" onclick="topoOpen('groups','${esc(g.id)}')" onkeydown="if(event.key==='Enter'){topoOpen('groups','${esc(g.id)}')}">
      <rect width="${NW}" height="${NH}" rx="12"></rect>
      <text x="12" y="19">${esc(trunc(g.name, 26))}</text>
      <text x="12" y="35" class="sub">${esc(g.folder)}</text>
      <title>${esc(g.id)}</title></g>`;
  });

  $("#main").innerHTML = `
    <div class="pagehead">
      <div class="toprow"><h2>Topology</h2></div>
      <div class="desc">Messaging groups → wirings → agent groups, plus destination ACL edges. Tap an edge or node to open it.</div>
    </div>
    <div id="topo">
      <div class="topo-tools">
        <button class="btn icon sm" onclick="topoZoom(-0.2)" aria-label="Zoom out">${ico("zoom-out")}</button>
        <button class="btn icon sm" onclick="topoZoom(0.2)" aria-label="Zoom in">${ico("zoom-in")}</button>
        <button class="btn sm" onclick="topoZoom(0)">Reset</button>
        <div class="spacer"></div>
        <button class="btn icon sm" onclick="refresh()" aria-label="Refresh">${ico("refresh")}</button>
      </div>
      <div class="canvas"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" data-w="${W}" role="img" aria-label="Fleet topology graph">${svg}</svg></div>
      <div class="legend">
        <span><i style="background:var(--edge-mention)"></i>wiring: mention</span>
        <span><i style="background:var(--edge-sticky)"></i>wiring: mention-sticky</span>
        <span><i style="background:var(--edge-pattern)"></i>wiring: pattern</span>
        <span><i style="background:var(--edge-dest)"></i>destination → channel</span>
        <span><i style="background:var(--edge-a2a)"></i>destination → agent (A2A)</span>
      </div>
    </div>`;
  topoZoom(0);
  if (window.innerWidth < 900) topoZoom(-0.4);
}
function trunc(s, n) { s = String(s ?? ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; }
function topoOpen(page, id) {
  nav(page).then(() => {
    // nav() → renderRows() has just set S.rendered to the array backing the DOM;
    // resolve the index against that exact snapshot so openDetail matches.
    const i = S.rendered.findIndex(r => r.id === id);
    if (i >= 0) openDetail(page, i);
  });
}
