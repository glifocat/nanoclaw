async function loadChatSessions() {
  const c = S.chat; if (!c) return;
  let res;
  try { res = await api("/api/chat/sessions?agentGroupId=" + encodeURIComponent(c.ag)); } catch { return; }
  if (S.chat !== c) return;
  if (!res.ok) { toast(false, "Couldn't list sessions", res.error?.message, res.cmd); return; }
  c.sessions = Array.isArray(res.data) ? res.data : [];
  const sel = $("#chatline");
  if (sel) {
    const cur = c.mode;
    // Only list sessions we can actually send to: a null channelType/platformId
    // makes every send fail ('target.channelType is required'). Prefer hiding
    // closed/ended sessions, but fall back to all sendable ones if that empties
    // the list, so a still-relevant closed session stays reachable.
    const sendable = c.sessions.filter(s => !s.isWebui && s.channelType && s.platformId);
    const open = sendable.filter(s => s.status !== "closed" && s.status !== "ended");
    const list = open.length ? open : sendable;
    sel.innerHTML = `<option value="webui">Private line (webui)</option>` +
      list.map(s =>
        `<option value="${esc(s.id)}">${esc(`${s.channelType || "?"} · ${s.name || s.platformId || s.id}${s.threadId ? " · thread" : ""}`)}</option>`).join("");
    sel.value = cur;
    if (sel.value !== cur) { sel.value = "webui"; setChatLine("webui"); }
  }
}

function startChatPoll() {
  stopChatPoll();
  S.chatTimer = setInterval(() => chatPoll(false), CHAT_POLL_MS);
}
function stopChatPoll() {
  if (S.chatTimer) { clearInterval(S.chatTimer); S.chatTimer = null; }
}

async function chatPoll(force) {
  const c = S.chat;
  if (!c || S.page !== "chat" || (!force && document.hidden)) return;
  const mode = c.mode;
  const q = mode === "webui" ? "agentGroupId=" + encodeURIComponent(c.ag) : "sessionId=" + encodeURIComponent(mode);
  let res;
  try { res = await api("/api/chat/history?" + q); } catch { return; }
  if (S.chat !== c || c.mode !== mode) return; // user moved on mid-flight
  if (!res.ok) { c.err = res.error?.message || "couldn't load history"; updateChatBanner(); return; }
  if (c.err) { c.err = ""; updateChatBanner(); }
  c.loaded = true;
  c.provisioned = mode === "webui" ? res.data.provisioned : true;
  c.session = res.data.session;
  c.messages = res.data.messages || [];
  c.pending = c.pending.filter(p => !c.messages.some(m => m.role === "operator" && m.text === p.text && m.time >= p.minTime));
  renderChatLog();
}

function fmtDay(d) {
  const today = new Date(); const yest = new Date(Date.now() - 86400e3);
  if (d.toDateString() === today.toDateString()) return "Today";
  if (d.toDateString() === yest.toDateString()) return "Yesterday";
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: d.getFullYear() === today.getFullYear() ? undefined : "numeric" });
}
const fmtClock = d => isNaN(d) ? "" : d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

function chatSetupCard(g) {
  return `<div class="chatsetup">
    <div class="eico" style="margin:0 auto 12px">${ico("sparkle")}</div>
    <div class="t" style="font-weight:700;font-size:14.5px">No private line to ${esc(g.name)} yet</div>
    <div class="h">Set one up and you can talk to ${esc(g.name)} right here. This creates a <b>webui messaging group</b> (<code>webui:${esc(g.folder)}</code>), a wiring, and a reply destination on the live instance — clearly named, fully removable.</div>
    <button class="btn pri" id="provbtn" onclick="provisionChat()">${ico("zap")} Set up private line</button>
  </div>`;
}

function renderChatLog() {
  const c = S.chat, log = $("#chatlog");
  if (!c || !log) return;
  const g = chatAgent();

  const sub = $("#chatsub");
  if (sub) {
    if (c.mode === "webui") {
      sub.textContent = "webui:" + (g.folder || "?") +
        (c.session ? ` · ${c.session.containerStatus === "running" ? "container awake" : "container napping"}` : c.provisioned ? " · no session yet" : "");
    } else {
      const s = chatModeSession();
      sub.textContent = s ? `${s.channelType} · ${s.platformId}` : "";
    }
  }
  const unprov = $("#unprovbtn");
  if (unprov) unprov.hidden = !(c.mode === "webui" && c.provisioned);
  const canSend = !(c.mode === "webui" && c.provisioned === false);
  const input = $("#chatinput"), sendb = $("#sendbtn");
  if (input) input.disabled = !canSend;
  if (sendb) sendb.disabled = !canSend;

  if (c.mode === "webui" && c.provisioned === false) {
    if (c.sig === "setup") return;
    c.sig = "setup";
    log.innerHTML = chatSetupCard(g);
    return;
  }
  if (!c.loaded) {
    if (c.sig !== "loading") { c.sig = "loading"; log.innerHTML = `<div class="chatsetup"><div class="h">Opening the line…</div></div>`; }
    return;
  }

  const msgs = c.messages.concat(c.pending.map(p => ({ role: "operator", text: p.text, time: p.time, pending: true })));
  msgs.sort((a, b) => String(a.time).localeCompare(String(b.time)));
  const last = msgs[msgs.length - 1];
  const thinking = !!last && last.role !== "agent" && Date.now() - new Date(last.time).getTime() < 10 * 60e3;
  const sig = `${c.mode}:${msgs.length}:${last ? last.time + last.role + (last.pending ? "p" : "") : ""}:${thinking}`;
  if (c.sig === sig) return;
  c.sig = sig;

  const nearBottom = !log.childElementCount || log.scrollHeight - log.scrollTop - log.clientHeight < 90;
  let html = "", prevDay = "";
  if (!msgs.length) {
    html = `<div class="chatsetup"><div class="h">No messages yet — say hi!${c.mode === "webui" ? " The first reply can take a minute or two while the container wakes up." : ""}</div></div>`;
  }
  for (const m of msgs) {
    const d = new Date(m.time);
    const day = isNaN(d) ? "" : d.toDateString();
    if (day && day !== prevDay) { prevDay = day; html += `<div class="daysep">${esc(fmtDay(d))}</div>`; }
    const cls = m.role === "operator" ? "op" : m.role === "agent" ? "ag" : "us";
    html += `<div class="msg ${cls}${m.pending ? " pending" : ""}">` +
      (m.role === "user" && m.sender ? `<span class="ms">${esc(m.sender)}</span>` : "") +
      `<div class="bub">${esc(m.text)}</div>` +
      (m.sentTo ? `<span class="mis">↪ delivered to ${esc(m.sentTo)}</span>` : "") +
      `<span class="mt">${m.pending ? "sending…" : esc(fmtClock(d))}</span></div>`;
  }
  if (thinking) {
    html += `<div class="msg ag typing"><div class="bub" role="status" aria-label="${esc(g.name)} is thinking"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><span class="mt">${esc(g.name)} is thinking…</span></div>`;
  }
  log.innerHTML = html;
  if (nearBottom) log.scrollTop = log.scrollHeight;
}

async function provisionChat() {
  const c = S.chat; if (!c) return;
  const btn = $("#provbtn");
  if (btn) { btn.disabled = true; btn.textContent = "Setting up…"; }
  let res;
  try { res = await api("/api/chat/provision", { method: "POST", body: JSON.stringify({ agentGroupId: c.ag }) }); }
  catch (e) { res = { ok: false, error: { message: e.message } }; }
  toast(res.ok, res.ok ? `Private line to ${chatAgent().name} is ready` : "Setup failed",
    res.ok ? "" : res.error?.message, res.ok ? (res.data.cmds || []).join("  ·  ") : res.cmd);
  if (S.chat !== c) return;
  if (res.ok) {
    await Promise.all([loadList("messaging-groups", true), loadList("wirings", true)]);
    c.provisioned = true; c.sig = "";
    renderChatLog();
    chatPoll(true);
  } else if (btn) { btn.disabled = false; btn.innerHTML = `${ico("zap")} Set up private line`; }
}

function unprovisionChat() {
  const c = S.chat; if (!c) return;
  const g = chatAgent();
  confirmModal(`Remove the private line to ${g.name}?`,
    `Deletes the webui:${g.folder} wiring and reply destination via ncl (and the messaging group too, unless a session still references it — then it's kept, disconnected). Transcripts on disk are not touched; setting the line up again reconnects them.`,
    () => api("/api/chat/unprovision", { method: "POST", body: JSON.stringify({ agentGroupId: c.ag }) }),
    async () => {
      await Promise.all([loadList("messaging-groups", true), loadList("wirings", true)]);
      if (S.chat === c) { c.provisioned = false; c.session = null; c.messages = []; c.pending = []; c.sig = ""; renderChatLog(); updateChatBanner(); }
    }, "Remove private line", { danger: 1 });
}

function autoGrow(ta) { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 140) + "px"; }
function composerKey(e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#composer").requestSubmit(); }
}

async function chatSubmit(e) {
  e.preventDefault();
  const c = S.chat; if (!c) return;
  if (c.mode === "webui" && !c.provisioned) return;
  const ta = $("#chatinput");
  const text = ta.value.trim();
  if (!text) return;
  const now = Date.now();
  const p = { text, time: new Date(now).toISOString(), minTime: new Date(now - 120e3).toISOString() };
  c.pending.push(p); c.sig = "";
  ta.value = ""; autoGrow(ta);
  renderChatLog();
  let body;
  if (c.mode === "webui") body = { agentGroupId: c.ag, text };
  else {
    const s = chatModeSession();
    if (!s) { c.pending = c.pending.filter(x => x !== p); c.sig = ""; renderChatLog(); toast(false, "Session not loaded yet", "Give it a second and try again."); return; }
    body = { text, target: { channelType: s.channelType, platformId: s.platformId, threadId: s.threadId ?? null } };
  }
  let res;
  try { res = await api("/api/chat/send", { method: "POST", body: JSON.stringify(body) }); }
  catch (err) { res = { ok: false, error: { message: err.message } }; }
  if (S.chat !== c) return;
  if (!res.ok) {
    c.pending = c.pending.filter(x => x !== p); c.sig = "";
    ta.value = text; autoGrow(ta);
    toast(false, "Message not sent", res.error?.message, res.cmd);
    renderChatLog();
    return;
  }
  setTimeout(() => chatPoll(true), 700);
}

/* =============================== boot ================================ */
(function initTheme() {
  const stored = localStorage.getItem("ncl_dash_theme");
  const t = stored || (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  applyTheme(t);
})();
$("#tok").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
// Keep the chat composer above the on-screen keyboard on mobile: expose the
// keyboard height as --kb, consumed by .chatwrap.full's bottom inset.
if (window.visualViewport) {
  const vvKb = () => {
    const kb = Math.max(0, window.innerHeight - window.visualViewport.height - window.visualViewport.offsetTop);
    document.documentElement.style.setProperty("--kb", kb + "px");
  };
  window.visualViewport.addEventListener("resize", vvKb);
  window.visualViewport.addEventListener("scroll", vvKb);
}
(async function boot() {
  renderNav();
  const hash = new URLSearchParams(location.hash.slice(1));
  const hashTok = hash.get("token");
  if (hashTok) {
    history.replaceState(null, "", location.pathname);
    $("#tok").value = hashTok.trim();
    await doLogin();
    return;
  }
  if (S.token) {
    $("#tok").value = S.token;
    await doLogin();
  }
})();
</script>
</body>
</html>
